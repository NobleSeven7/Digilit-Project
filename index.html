<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1C1A17" />
    <!-- The app has its own light and dark themes, so browsers should not
         recolour it themselves. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Pick the theme before the page is drawn, so there is no flash of the
         wrong colours. Same rule as src/lib/theme.js: saved choice, else device. -->
    <script>
      (function () {
        var theme = null
        try { theme = localStorage.getItem('raastashare-theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        // The phone's status bar matches the header of this theme (label
        // black, or the dark theme's warm grey), so the top of the screen is
        // one colour. Keep in step with --color-brand in src/index.css.
        document.querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#3B352D' : '#1C1A17')
      })()
    </script>
    <meta name="description" content="RaastaShare - send parcels with travellers already going your way. Student prototype with fictional data." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231C1A17'/%3E%3Cpath d='M6 16h20' stroke='white' stroke-width='3' stroke-dasharray='4 3'/%3E%3Ccircle cx='6' cy='16' r='4' fill='white'/%3E%3Ccircle cx='26' cy='16' r='4' fill='white'/%3E%3C/svg%3E" />
    <!-- Install on a phone's home screen (public/manifest.webmanifest, public/sw.js) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RaastaShare" />
    <title>RaastaShare</title>
  </head>
  <body>
    <!-- React draws the whole app inside this div -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
